# Change these first
owner: GregoirePelegrin # Your GitHub organization or username, where this repository lives
repo: upptime # The name of this repository

sites:
  - name: Similarités votes
    url: $SECRET_VOTES_SITE
  - name: Similarités votes SSL
    check: ssl
    url: $SECRET_VOTES_HOST
    port: 443
  - name: Calendrier
    url: $SECRET_CALENDAR_SITE
  - name: Calendar SSL
    check: ssl
    url: $SECRET_CALENDAR_HOST
    port: 443

status-website:
  # cname: demo.upptime.js.org
  baseUrl: /upptime
  logoUrl: https://raw.githubusercontent.com/upptime/upptime.js.org/master/static/img/icon.svg
  name: Upptime
  introTitle: "**Upptime** is the open-source uptime monitor and status page, powered entirely by GitHub."
  introMessage: My Apps
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

# Upptime also supports notifications, assigning issues, and more
# See https://upptime.js.org/docs/configuration
secrets:
  - SECRET_VOTES_SITE
  - SECRET_VOTES_HOST
  - SECRET_CALENDAR_SITE
  - SECRET_CALENDAR_HOST
  - NOTIFICATION_TELEGRAM
  - NOTIFICATION_TELEGRAM_BOT_KEY
  - NOTIFICATION_TELEGRAM_CHAT_ID
